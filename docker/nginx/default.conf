#=========================================================================
# Nginx Default Configuration
#=========================================================================

# Bloque 1: Redirigir TODO el tráfico HTTP (puerto 80) a HTTPS sin www
server {
    listen 80;
    server_name artetitival.com www.artetitival.com localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        # Cambiamos $host por el dominio fijo para forzar la redirección
        return 301 https://artetitival.com$request_uri;
    }
}

# Bloque 2: Capturar el tráfico HTTPS con "www" y redirigirlo sin "www"
server {
    listen 443 ssl;
    server_name www.artetitival.com;

    # Se requieren los certificados aquí para que no falle la conexión segura antes de la redirección
    ssl_certificate /etc/letsencrypt/live/artetitival.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artetitival.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://artetitival.com$request_uri;
}

# Bloque 3: Tu aplicación real (SOLO para el dominio sin www)
server {
    listen 443 ssl;
    # Quitamos el www de esta línea
    server_name artetitival.com; 
    
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/artetitival.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artetitival.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}